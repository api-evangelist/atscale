aid: atscale

name: Atscale

image: https://www.atscale.com/wp-content/uploads/2021/12/AtScale_Logo_RGB_2C.png

description: AtScale provides a semantic layer platform that enables enterprises to unify data across data warehouses, data lakes, and cloud services,
  delivering AI‑powered analytics, business intelligence, and data governance. Their solution supports integrations with Snowflake, Databricks,
  Google BigQuery, Amazon Redshift, Microsoft Azure, and many other platforms, helping organizations to build a trusted analytics foundation for
  AI and BI workloads.

